<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Обелиск: Монополия</title>
  <style>
    :root { --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); }
    html, body { margin: 0; height: 100%; height: 100dvh; background: #10141c; overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    /* T-198: игровая колонка — вся ширина телефона, на планшетах/складных не шире 480 px (3:4 → колонка по центру, поля фона по бокам);
       высота колонки не короче соотношения 2,5:1 (0,4) — на очень высоких окнах поля сверху/снизу. #stage/#ui/#fx — один и тот же бокс (проекции HUD, joystick). */
    #stage, #ui, #fx { position: fixed; inset: 0; margin: auto; width: min(100%, 480px); height: min(100%, calc(min(100vw, 480px) / 0.4)); }
    #game { display: block; width: 100%; height: 100%; touch-action: none; }
    #ui { pointer-events: none; font-family: system-ui, sans-serif; color: #f2efe6; }
    #ui .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
    #ui .screen[hidden] { display: none; }
    #ui h1 { margin: 0; font-size: 28px; text-shadow: 0 2px 6px #000; }
    #ui button:not([class*="om5-"]) { pointer-events: auto; touch-action: manipulation; min-width: 160px; min-height: 56px; font-size: 20px;
      border: 0; border-radius: 14px; background: #e0b040; color: #1a1408; font-weight: 700; }
    #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #10141c;
      color: #f2efe6; font: 20px system-ui, sans-serif; text-align: center; padding: 24px; }
    @media (orientation: landscape) and (max-height: 500px) { #rotate { display: flex; } }
  </style>
  <script type="module" crossorigin src="./js/index--3w-5ugz.js"></script>
  <link rel="modulepreload" crossorigin href="./js/three-VfcNxThw.js">
  <link rel="stylesheet" crossorigin href="./css/index-Cbfs315O.css">
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>
  <div id="fx"></div>
  <div id="ui">
    <div class="screen" data-screen="menu" id="screen-menu">
      <div class="st-banner"><h1>Долина</h1></div>
      <div class="st-scene" role="img" aria-label="Герой и волк на острове у обелиска"></div>
      <button id="btn-play" type="button">Начать</button>
    </div>
  </div>
  <div id="rotate">Поверните телефон вертикально</div>
</body>
</html>
