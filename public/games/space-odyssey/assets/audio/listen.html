<script>const C=new (window.AudioContext||window.webkitAudioContext)();
async function p(f,r=1){await C.resume();const b=await C.decodeAudioData(await (await fetch(f)).arrayBuffer());const s=C.createBufferSource();s.buffer=b;s.playbackRate.value=r;s.connect(C.destination);s.start()}
async function ladder(){const f=Object.values({"ui_tap": ["sfx/ui_tap_01.ogg", "sfx/ui_tap_02.ogg", "sfx/ui_tap_03.ogg"], "ui_open": ["sfx/ui_open_01.ogg", "sfx/ui_open_02.ogg"], "ui_close": ["sfx/ui_close_01.ogg", "sfx/ui_close_02.ogg"], "buy_denied": ["sfx/buy_denied_01.ogg", "sfx/buy_denied_02.ogg"]})[0];const src=([])[0];if(!src)return alert('нет файла catch');
for(const st of [0, 2, 4, 7, 9, 12]){p(src,2**(st/12));await new Promise(r=>setTimeout(r,260))}}</script>
